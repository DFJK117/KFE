# KFE 的 Android 编译
#
# 目标产物只有两个：Windows（exe）和 Android（apk）。
# Linux 桌面端不是目标，已降级为手动触发（留着当诊断工具）。
#
# 为什么 Android 反倒有可能编得出来：
#   Windows 那条一直挂在 haxe 进程 OOM，天花板是 Windows 的「提交上限」
#   = 物理内存 16GB + 页面文件 2.9GB = 18.87GB。
#   这个 job 跑在 Linux runner 上，没有那套硬限制，
#   haxe 阶段（两个平台都一样）说不定就过去了。
#
# ⚠️ 已知限制，先写清楚别装：
#   linc_luajit / hxvm-luajit 在 Project.xml 里是 if="desktop" 装的，
#   FEATURE_LUAMODCHART 也只放宽到 desktop。
#   所以 **Android 版本不带 Lua modchart 层**（LuaJIT 原生库要另做移动端适配）。
#   其余兼容能力（资源加载、别名注册、警告音符等）照常编进去。

name: KFE Build (Android)

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    env:
      HAXELIB_PATH: ${{ github.workspace }}/../haxelib
      HXCPP_COMPILE_THREADS: '2'
      # ★ rebuild 原生库（extension-webm）时必须指明 Android 架构，否则 hxcpp 直接报：
      #     Error: Please set one of the architectures, eg HXCPP_ARM64, HXCPP_X86, ...
      #   设两个架构，rebuild 会编出对应 ndll，lime build android 也编两种 ABI，
      #   不会因为「只编了 arm64 但 build 想要 armv7」之类不匹配再失败一轮。
      HXCPP_ARM64: '1'
      HXCPP_ARMV7: '1'
      # lime 7.9 这一代用的是比较老的 Android SDK/NDK/Gradle 组合，
      # 用太新的反而编不过，这里按它的年代挑版本。
      # ★ 注意变量名：lime 检查的是 ANDROID_SDK（不是 ANDROID_SDK_ROOT！），
      #   上次 5 秒失败的真凶就是它：
      #     Error: You must define ANDROID_SDK and ANDROID_NDK_ROOT to target Android,
      #            please run 'lime setup android' first
      #   两个都设：lime 读 ANDROID_SDK，工作流脚本里继续用 $ANDROID_SDK_ROOT。
      ANDROID_SDK: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-sdk/ndk/21.4.7075529

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # lime/openfl 在 Linux 上编译需要的系统库；
      # gcc-multilib / g++-multilib 是给 32 位目标准备的（踩过：
      #   /usr/include/stdint.h: fatal error: bits/libc-header-start.h
      #   没有那个文件）。
      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxinerama-dev \
            libasound2-dev libpulse-dev \
            libudev-dev \
            gcc-multilib g++-multilib

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 装 Android SDK 与 NDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          # cmdline-tools
          curl -sSL -o cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline.zip
          rm cmdline.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties \
             cmdline-tools/NOTICE.txt cmdline-tools/latest/ 2>/dev/null || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;21.4.7075529"
          echo "--- 装好了 ---"
          ls "$ANDROID_SDK_ROOT"
          ls "$ANDROID_NDK_ROOT" | head -5

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5

      - name: 机器规格（诊断用）
        run: |
          free -h
          nproc

      - name: 安装依赖
        run: |
          set -e
          mkdir -p "$HAXELIB_PATH"
          haxelib setup "$HAXELIB_PATH"
          haxelib install hxcpp 4.2.1
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.9.0
          haxelib install flixel-addons 2.10.0
          haxelib install flixel-ui 2.3.3
          haxelib install hscript 2.0.7
          haxelib install actuate 1.9.0
          haxelib install polymod 1.4.3
          haxelib git faxe https://github.com/uhrobots/faxe || true
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib git extension-webm https://github.com/Kade-github/extension-webm
          # 注意：linc_luajit / hxvm-luajit 是 if="desktop"，Android 下不需要
          haxelib list | tee haxelib-list.txt

      # ★ lime 7.9 在跑 android 目标前必须先「配置」一次 android 工具链，
      #   否则 rebuild/build 会直接报：
      #     Error: You need to run "lime setup android" before you can use the Android target
      #   ANDROID_SDK_ROOT / ANDROID_NDK_ROOT 已经设好，这里只让 lime 把配置写进
      #   ~/.lime/config，不重新下载（NDK 我们已经手动装到指定路径了）。
      - name: 配置 lime android 工具链
        run: |
          haxelib run lime setup android
          # 双保险：把 SDK/NDK 路径直接写进 lime 全局配置（~/.lime），
          # 即使 setup 交互没写进去，build 时也能从 config 读到。
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          echo "--- lime 全局配置 ---"
          cat ~/.lime/config.xml 2>/dev/null || true

      # ★ 修 libwebm 在 Android NDK clang 下的编译错误
      #   上一条 Android 死在 rebuild extension-webm：
      #     ./libwebm/mkvmuxerutil.cpp:614:7: error: use of undeclared identifier 'read'
      #     ./libwebm/mkvmuxerutil.cpp:615:7: error: use of undeclared identifier 'close'
      #   根因：libwebm 用了 POSIX 的 read()/close()/open() 等，却没 include <unistd.h>；
      #   新版 NDK 的 clang 不再隐式声明它们。Windows 那边 MSVC 有这些符号所以能过，
      #   只有 Android NDK 会爆。给 libwebm 所有 .c/.cpp 补上 <unistd.h> + <fcntl.h>
      #   （重复 include 有头文件守卫，无害）。
      - name: 修 libwebm 的 POSIX include（Android NDK）
        run: |
          set -e
          # extension-webm 在 haxelib 下可能有多个检出副本（git/<sha>/ 与 git/libs.src/ 等），
          # lime rebuild 实际编译的是其中一个。上一版只 patch 了第一个就漏了真正的那份
          # （报错行号 614 一直没变，证明编译用的是没改到的副本）。
          # 所以这里把 extension-webm 下**所有** mkvmuxerutil.cpp 及其同根的 .c/.cpp 全补上。
          patched=0
          found=$(find "$HAXELIB_PATH/extension-webm" -name mkvmuxerutil.cpp 2>/dev/null)
          echo "找到 mkvmuxerutil.cpp 副本数: $(echo "$found" | grep -c .)"
          while IFS= read -r F; do
            [ -z "$F" ] && continue
            ROOT=$(dirname "$F"); ROOT=$(dirname "$ROOT")
            echo "  patch 根: $ROOT"
            while IFS= read -r c; do
              if ! grep -q '#include <unistd.h>' "$c"; then
                sed -i '1i #include <unistd.h>\n#include <fcntl.h>' "$c"
                patched=$((patched+1))
              fi
            done < <(find "$ROOT" -type f \( -name '*.cpp' -o -name '*.c' \) 2>/dev/null)
          done < <(printf '%s\n' "$found")
          echo "已给 $patched 个源文件补 unistd.h/fcntl.h"

      # extension-webm 在 Project.xml 里是无条件加载的（:122），
      # 所以 Android 也必须有它的 ndll，不然 lime 复制阶段就会报：
      #   Error: Source path .../ndll/Android/... does not exist
      - name: 重编 extension-webm（Android）
        run: haxelib run lime rebuild extension-webm android

      # ★ 防内存杀手：上次编译跑了 5 分钟被 SIGTERM(143) 干掉——ubuntu runner 镜像
      #   带 systemd-oomd，内存压力高时它直接对编译进程发 SIGTERM（Windows 那边
      #   的"提交上限 OOM"同理，根源一致：内存不够编 KFE 全量）。
      #   对策：划 8GB swap（等效扩页面文件）+ 停用 oomd，双保险。
      - name: 加 8GB swap 并停用 oomd（防 SIGTERM 内存杀手）
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          # ★ 彻底禁用 oomd：必须连 socket 一起停（它是 socket 激活的，
          #   只 stop/disable service 会被 socket 重新拉起）+ mask 防复活。
          #   上一轮就是漏了 socket，编译 13 分钟又被 oomd SIGTERM 全家杀。
          sudo systemctl disable --now systemd-oomd.service systemd-oomd.socket 2>/dev/null || true
          sudo systemctl mask systemd-oomd.service systemd-oomd.socket 2>/dev/null || true
          sudo systemctl daemon-reload 2>/dev/null || true
          echo "--- oomd 进程检查（应显示无）---"
          ps aux | grep -i oomd | grep -v grep || echo "无 oomd 进程，OK"
          echo "--- swap 已启用 ---"
          swapon --show
          free -h

      - name: 编译 android -release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          (
            while true; do
              echo "$(date +%H:%M:%S) $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB"}')" >> memlog.txt
              # 【KFE 诊断】心跳上传：每 60 秒把 build.log 快照 commit+push 到 ci-diag。
              # 编译进程无论被谁杀（oomd/OOM killer/runner 重启），死前 1 分钟内的
              # 报错都一定已经在远端分支上——彻底封死日志黑洞。
              if [ -f build.log ]; then
                tail -n 500 build.log > build.diag.log 2>/dev/null || true
                git add -f build.diag.log memlog.txt 2>/dev/null || true
                git commit -m "ci-diag heartbeat $(date +%H:%M:%S)" >/dev/null 2>&1 || true
                git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-diag >/dev/null 2>&1 || true
              fi
              sleep 60
            done
          ) &
          MEMPID=$!

          set +e
          # 【KFE 诊断】把构建输出抓到 build.log，失败时能发到公开 Issue 让我这边读到
          # （GitHub 日志接口在我这边要管理员权限，Issue 对公开仓库可匿名读，绕过 403）。
          haxelib run lime build android -release > build.log 2>&1
          RC=$?
          kill $MEMPID 2>/dev/null || true

          echo "--- 内存曲线（全程）---"
          cat memlog.txt || true
          echo "--- 找 APK ---"
          find export -name "*.apk" -o -name "*.aab" 2>/dev/null | head -10
          ls -la export/release/android/bin || true

          # ★ 退出码规范化：上次编译被 systemd-oomd SIGTERM(143) 杀死，
          #   exit 143 会被 runner 当成"取消信号"，直接跳过后面所有 if: failure()
          #   诊断步骤（上传日志 / 推 ci-diag 全没跑），造成日志黑洞。
          #   规范化成 1 保证诊断必跑；顺便把 build.log 尾部打进主日志留底。
          if [ "$RC" -ne 0 ]; then
            echo "!! 编译失败，原始退出码 $RC"
            echo "--- build.log 末尾 80 行 ---"
            tail -n 80 build.log || true
            exit 1
          fi
          exit 0

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KFE-android
          path: export/release/android/bin
          if-no-files-found: error
          retention-days: 30

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KFE-android-logs
          path: |
            memlog.txt
            build.log
            export/release/android/haxe/log.txt
          if-no-files-found: warn
          retention-days: 14

      # 【KFE 诊断】构建失败时，把 build.log 推到 ci-diag 分支。
      # 为什么不直接用 GitHub 日志接口 / 产物下载：它们都要鉴权（403/401），本机拿不到；
      # 公开仓库建 Issue 的 GITHUB_TOKEN 默认没有 issues:write 权限（上一版假成功，Issue 没建出来）；
      # 而本机 git 协议能联网（git ls-remote / clone 都正常），普通 curl 却走代理 HTTP 000。
      # 所以最稳的闭环是：让 CI 自己用 GITHUB_TOKEN 把日志 git commit 进 ci-diag 分支，
      # 我这边 `git fetch origin ci-diag` 就能匿名拉到真实报错。
      # （ci-diag 不在 on.push.branches 列表里，push 它不会再次触发本 workflow，避免循环。）
      - name: 把 build.log 推到 ci-diag 分支（绕过日志 403）
        if: failure()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.email "ci@users.noreply.github.com"
          git config user.name "KFE CI Bot"
          # 只取尾部 3000 行，足够看报错，又不会把巨大的完整日志塞进 git 对象
          tail -n 3000 build.log > build.diag.log 2>/dev/null || true
          git add -f build.diag.log memlog.txt 2>/dev/null || true
          git commit -m "ci-diag: android build.log run ${{ github.run_id }}" || echo "无新增内容"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-diag --force || echo "push 失败"
