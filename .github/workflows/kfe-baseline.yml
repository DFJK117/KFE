# KFE 基线对照 v2：编译**不带任何 KFE 补丁**的原版 Kade Engine 1.8（Android）
#
# 目的：判决 haxe 内存爆炸（haxe 进程 14.8GB、15G 物理 + 8G swap 全满被内核杀）
#   到底是 KFE 补丁引入的，还是「haxe 4.1.5 + 今天的依赖 git 版本 + Android 目标」本身就爆。
#   - 原版也爆   → 问题在依赖/编译器组合（主工作流换 haxe 4.2.5 的验证并行进行）
#   - 原版正常（3~5GB）→ 问题在 KFE 补丁 → 回去二分 KFE 的 4 新文件 + 7 修改文件
#
# 心跳快照（每 60s 把 build.log 尾部 + 法医快照推到 ci-diag）与主工作流共用 ci-diag 分支。
# 用法：push 自动跑（与主工作流并行），也可在 Actions 页面手动触发。

name: KFE 基线对照（原版 KE 1.8 · Android）

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  baseline-android:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    env:
      HAXELIB_PATH: ${{ github.workspace }}/../haxelib
      HXCPP_COMPILE_THREADS: '1'
      HXCPP_ARM64: '1'
      HXCPP_ARMV7: '1'
      ANDROID_SDK: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-sdk/ndk/21.4.7075529

    steps:
      - name: Checkout 原版 KE 1.8（不带 KFE 补丁）
        uses: actions/checkout@v4
        with:
          repository: KadeDev/Kade-Engine
          ref: 1.8

      - name: 装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libglu1-mesa-dev \
            libx11-dev libxext-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxinerama-dev \
            libasound2-dev libpulse-dev \
            libudev-dev \
            gcc-multilib g++-multilib

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: 装 Android SDK 与 NDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"
          curl -sSL -o cmdline.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline.zip
          rm cmdline.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/source.properties \
             cmdline-tools/NOTICE.txt cmdline-tools/latest/ 2>/dev/null || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;21.4.7075529"

      # 基线刻意保持 haxe 4.1.5：主工作流同时验证 4.2.5，两边一对照，
      # 就能分清「编译器版本」和「KFE 补丁」各占多少责任。
      - name: Setup Haxe 4.1.5（基线刻意保持旧版）
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5

      - name: 安装依赖（对齐官方 appveyor 组合）
        run: |
          set -e
          mkdir -p "$HAXELIB_PATH"
          haxelib setup "$HAXELIB_PATH"
          haxelib install hxcpp 4.2.1
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.9.0
          haxelib install flixel-addons 2.10.0
          haxelib install flixel-ui 2.3.3
          haxelib install hscript 2.0.7
          haxelib install actuate 1.9.0
          haxelib install polymod 1.4.3
          haxelib git faxe https://github.com/uhrobots/faxe || true
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib git extension-webm https://github.com/KadeDev/extension-webm
          # 原版 appveyor 还装了 lua 两件套；Project.xml 里 if="desktop"，
          # Android 目标不引用，装上只为和官方环境对齐
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git || true
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit || true
          haxelib list

      - name: 配置 lime android 工具链
        run: |
          haxelib run lime setup android
          haxelib run lime config ANDROID_SDK "$ANDROID_SDK"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"

      - name: 修 libwebm 的 POSIX include（Android NDK）
        run: |
          set -e
          patched=0
          found=$(find "$HAXELIB_PATH/extension-webm" -name mkvmuxerutil.cpp 2>/dev/null)
          echo "找到 mkvmuxerutil.cpp 副本数: $(echo "$found" | grep -c .)"
          while IFS= read -r F; do
            [ -z "$F" ] && continue
            ROOT=$(dirname "$F"); ROOT=$(dirname "$ROOT")
            while IFS= read -r c; do
              if ! grep -q '#include <unistd.h>' "$c"; then
                sed -i '1i #include <unistd.h>\n#include <fcntl.h>' "$c"
                patched=$((patched+1))
              fi
            done < <(find "$ROOT" -type f \( -name '*.cpp' -o -name '*.c' \) 2>/dev/null)
          done < <(printf '%s\n' "$found")
          echo "已给 $patched 个源文件补 unistd.h/fcntl.h"

      - name: 重编 extension-webm（Android）
        run: haxelib run lime rebuild extension-webm android

      - name: 加 8GB swap 并停用 oomd（防 SIGTERM 内存杀手）
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo systemctl disable --now systemd-oomd.service systemd-oomd.socket 2>/dev/null || true
          sudo systemctl mask systemd-oomd.service systemd-oomd.socket 2>/dev/null || true
          sudo systemctl daemon-reload 2>/dev/null || true
          swapon --show
          free -h

      - name: 编译 android -release（原版）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.email "ci@users.noreply.github.com"
          git config user.name "KFE CI Bot"
          (
            while true; do
              {
                echo "===== $(date '+%F %T') ====="
                free -h
                echo "--- 内存大户 TOP6 ---"
                ps aux --sort=-rss | head -n 7
                echo "--- 内核 kill/OOM 记录 ---"
                sudo dmesg 2>/dev/null | grep -iE "kill|oom|out of memory" | tail -n 20
              } > diag.snapshot 2>&1
              if [ -f build.log ]; then
                tail -n 400 build.log > build.diag.log 2>/dev/null || true
                cat diag.snapshot >> build.diag.log 2>/dev/null || true
                git add -f build.diag.log 2>/dev/null || true
                git commit -m "ci-diag-baseline heartbeat $(date +%H:%M:%S)" >/dev/null 2>&1 || true
                git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-diag-baseline >/dev/null 2>&1 || true
              fi
              sleep 60
            done
          ) &
          MEMPID=$!

          set +e
          haxelib run lime build android -release > build.log 2>&1
          RC=$?
          kill $MEMPID 2>/dev/null || true

          echo "--- 内存曲线 ---"
          cat diag.snapshot || true
          if [ "$RC" -ne 0 ]; then
            echo "!! 原版编译失败，原始退出码 $RC"
            echo "--- build.log 末尾 80 行 ---"
            tail -n 80 build.log || true
            # 失败也把日志推上去，保证基线数据可读
            tail -n 400 build.log > build.diag.log 2>/dev/null || true
            git add -f build.diag.log 2>/dev/null || true
            git commit -m "ci-diag-baseline: android build.log run ${{ github.run_id }}" >/dev/null 2>&1 || true
            git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:ci-diag-baseline >/dev/null 2>&1 || true
            exit 1
          fi
          exit 0

      - name: 上传基线 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-KE18-android
          path: export/release/android/bin
          if-no-files-found: error
          retention-days: 30
