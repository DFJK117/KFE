# KFE (KadeFuck Engine) —— Windows 云端编译
#
# 为什么用云端编译：KFE 的补丁从来没有被真正编译验证过。
# 本机没有 Haxe 工具链，而装一套（haxe + haxelib + lime + hxcpp + MSVC）
# 又重又慢。GitHub Actions 直接给你一台现成的 windows-latest 机器。
#
# 用法：
#   1. 把这个仓库推到 GitHub
#   2. push 后自动触发；也可以在 Actions 页面点 "Run workflow" 手动触发
#   3. 编译完在 run 页面底部下载 artifact "KFE-windows"
#
# 说明：原版仓库自带的 windows.yml 用的是 actions/upload-artifact@v2（已被 GitHub 停用）
# 且用 debug 构建却上传 release 路径，必然拿不到东西。这里一并修掉。

name: KFE Build (Windows)

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      HAXELIB_PATH: ${{ github.workspace }}\..\haxelib

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.1.5

      - name: Cache haxelib
        uses: actions/cache@v4
        with:
          path: ${{ env.HAXELIB_PATH }}
          key: haxelib-${{ runner.os }}-${{ hashFiles('Project.xml') }}
          restore-keys: |
            haxelib-${{ runner.os }}-

      - name: 安装依赖
        shell: bash
        run: |
          set -e
          mkdir -p "$HAXELIB_PATH"
          haxelib setup "$HAXELIB_PATH"

          # ── hxcpp 必须先装、且必须锁版本 ──
          # Haxe 4.1.5 是 2021 年的编译器，带不动 hxcpp 4.3.x（那个要 Haxe 4.2+）。
          # 4.2.1 是这一代的配套版本。不显式装的话，lime 会把 haxelib 上
          # 最新的 hxcpp（4.3.x）拉下来，然后 hxcpp 自己的构建脚本就会挂。
          haxelib install hxcpp 4.2.1

          # ── 核心库：每个版本都必须写死 ──
          # 为什么不能省版本号：flixel 的 include.xml 只声明依赖 openfl、且不锁版本；
          # flixel-addons / flixel-ui 连依赖都不声明。haxelib 碰到「不锁版本」的
          # 依赖会直接装最新的（现在的 flixel 6.x），而 6.x 要求 lime 8.x ——
          # 和我们锁死的 lime 7.9.0 正面对撞。所以这一串必须全写。
          #
          # 下面每个版本号都在 lib.haxe.org 上逐个核实过存在（HTTP 200）：
          #   lime 7.9.0 / openfl 9.1.0 / flixel 4.9.0
          #   flixel-addons 2.10.0 / flixel-ui 2.3.3 / hscript 2.0.7 / actuate 1.8.7
          #
          # ⚠️ 反面清单：flixel 4.9.1、flixel-addons 2.9.1、flixel-ui 2.3.4
          #    这三个版本号在 haxelib 上**根本不存在**（404），它们是凭印象瞎写
          #    的，会直接把 CI 卡死在装依赖这一步。别照抄。
          haxelib install lime 7.9.0
          haxelib install openfl 9.1.0
          haxelib install flixel 4.9.0
          haxelib install flixel-addons 2.10.0
          haxelib install flixel-ui 2.3.3
          haxelib install hscript 2.0.7
          haxelib install actuate 1.8.7

          # 注意：这里一律不加 --quiet。haxelib 的位置参数是
          # `install <name> [version]`，多塞一个 --quiet 有被当成 version 的风险。
          haxelib run lime setup flixel || true
          haxelib run lime setup || true

          # ── polymod：★ 这里和原版 KE 的 windows.yml 不一样，是修过的 ──
          #
          # 原版 KE 1.8 写的是 `haxelib git polymod https://github.com/MasterEric/polymod.git`，
          # 但这个仓库现在**已经 404 了**（实测：`gh api repos/MasterEric/polymod` → Not Found）。
          # 第一次 CI 就是死在这一步：
          #     Installing polymod from https://github.com/MasterEric/polymod.git
          #     Error: Could not clone Git repository.
          #
          # polymod 现在的家是 FunkinCrew/polymod（实测 larsiusprime/polymod 301 → FunkinCrew/polymod）。
          # 但**不能直接用它的 master**：master(=1.8.0) 把
          #     scan(modRoot:String, ...)     改成了  scan(?scanParams:ScanParams)
          # 而 KE 的 ModCore.hx 调的是 Polymod.scan(MOD_DIRECTORY)（传字符串），会类型不匹配。
          # 实测 scan(String) 的最后一个版本是 v1.6.0，v1.8.0 才改掉。
          #
          # 所以这里锁 1.4.3：
          #   - haxelib 上确实有这个发布版（lib.haxe.org/p/polymod/1.4.3 → HTTP 200）
          #     （1.0 / 1.1 / 1.2 在 haxelib 上都是 404，只有 1.3.0 起才有发布）
          #   - PolymodParams 字段全齐：modRoot/dirs/framework/frameworkParams/apiVersion/
          #     errorCallback/parseRules/ignoredFiles/customBackend —— ModCore.hx 用到的都在
          #   - PolymodAssetType 是 `enum abstract ... from String`，
          #     所以 KE 的 Polymod.listModFiles("IMAGE") 传字符串是合法的
          haxelib install polymod 1.4.3

          # ── 必须是 git 版本（haxelib 上没有对应发布） ──
          # faxe 只在 switch 平台需要（Project.xml: <haxelib name="faxe" if='switch'/>），
          # Windows 用不到；haxelib 上也查无此库。装不上就算了。
          haxelib git faxe https://github.com/uhrobots/faxe --quiet || true
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet

          # ── extension-webm：KadeDev 分支，且必须本地重编 ──
          # KadeDev 这个账号已经改名成 Kade-github（实测 301 重定向）。
          # git clone 虽然会跟随重定向，但这里直接写现名，少一个失败点。
          haxelib git extension-webm https://github.com/Kade-github/extension-webm --quiet

          # ── ★ Lua 运行时（ModchartState/LuaClass 里 import llua.* 就来自这里） ──
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git --quiet
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit --quiet

          haxelib list

      - name: 重编 extension-webm（原生库）
        shell: bash
        run: haxelib run lime rebuild extension-webm windows

      - name: 编译 windows -release
        shell: bash
        run: |
          set -e
          haxelib run lime build windows -release
          echo "--- 产出目录 ---"
          ls -la export/release/windows/bin || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: KFE-windows
          path: export/release/windows/bin
          if-no-files-found: error
          retention-days: 30

      # 编译失败时把 log 也带上来，方便贴回来看
      - name: 失败时上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KFE-build-logs
          path: |
            export/release/windows/haxe/log.txt
            export/release/windows/obj
          if-no-files-found: warn
          retention-days: 14
